name: SETTA MES GeneralReport — 07h20 + recuperação automática
on:
  schedule:
    # Horário de Brasília (UTC−03): 10:20 UTC = 07:20 BRT.
    # GitHub Actions pode atrasar horas. Tentativas de recuperação alternadas
    # evitam depender de um único evento de schedule.
    # A rotina --scheduled só consulta a MES após 07:20 BRT e ainda não
    # conferida hoje; execuções redundantes terminam sem baixar a fonte.
    - cron: '20 10 * * *'
    - cron: '17 */2 * * *'
  workflow_dispatch:
  # Ao homologar mudanças na integração MES em main, republicar a fonte
  # somente após os testes de contrato terem concluído com sucesso.
  workflow_run:
    workflows: ["Validar integração MES GeneralReport"]
    types: [completed]
concurrency:
  group: setta-mes-generalreport-source
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update-generalreport:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SETTA_MES_GENERAL_REPORT_TOKEN: ${{ secrets.SETTA_MES_GENERAL_REPORT_TOKEN }}
      SETTA_SUPABASE_ANON_KEY: ${{ secrets.SETTA_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Confirmar credencial presente sem imprimi-la
        run: |
          if [ -z "$SETTA_MES_GENERAL_REPORT_TOKEN" ]; then
            echo "Configure SETTA_MES_GENERAL_REPORT_TOKEN em GitHub Actions Secrets do repositório."
            exit 1
          fi
      - name: Buscar, validar e publicar Relatório Geral MES
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Intervenção explícita do operador é a única execução forçada.
            python mes_general_report_sync.py
          else
            # Cron e atualização de código não criam versões repetidas
            # no mesmo dia, após uma conferência bem-sucedida.
            python mes_general_report_sync.py --scheduled
          fi
