name: CI

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile streamlit_app.py data_store.py monitor_logic.py monitor_worker.py ui.py mes_refresh_flow.py
      - name: Testar sincronização manual e retomada agendada sem credenciais
        run: python -m unittest discover -s tests -p 'test_mes_refresh_flow.py' -v
      - name: Validate UI contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("ui.py").read_text(encoding="utf-8"))
          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required = {
              "api_card",
              "derived_card",
              "inject_css",
              "integration_card",
              "kpi_grid",
              "logo_html",
              "section_band",
              "render_setta_shell",
              "source_card",
          }
          missing = sorted(required - functions)
          assert not missing, f"Funções UI ausentes: {missing}"

          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          assert "ui_components.integration_card(item)" in app
          assert 'key=f"setta_nav_{index}"' in app
          css = Path("assets/setta-monitor.css").read_text(encoding="utf-8")
          nav = Path("assets/setta-monitor-navigation.js").read_text(encoding="utf-8")
          assert ".setta-drawer-toggle::before" in css and "rotate(-45deg)" in css
          assert "setDrawer(!drawerOpen())" in nav
          assert Path("assets/outfit-latin.woff2").is_file()
          print("UI_CONTRACT_OK")
          PY
