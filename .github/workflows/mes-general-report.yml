name: Validar integração MES GeneralReport
on:
  push:
    branches:
      - main
      - feat/mes-generalreport-api-20261109
    paths:
      - mes_general_report.py
      - monitor_logic.py
      - data_store.py
      - tests/test_mes_general_report.py
      - .github/workflows/mes-general-report.yml
  pull_request:
    branches: [main]
jobs:
  mes-general-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências de validação
        run: python -m pip install "requests>=2.32,<3" "pandas>=2.2,<3" "openpyxl>=3.1,<4"
      - name: Validar sintaxe
        run: python -m py_compile data_store.py monitor_logic.py mes_general_report.py
      - name: Testar integração sem credenciais reais
        run: python -m unittest discover -s tests -p 'test_mes_general_report.py' -v
