name: Validar integração MES GeneralReport
on:
  push:
    branches:
      - main
      - feat/mes-generalreport-api-20261109
      - feat/mes-generalreport-homologacao-20261109
      - fix/mes-auditoria-codigo-ausente-20261110
      - feat/mes-reconciliar-excecoes-e-excel-20261110
      - feat/mes-diagnostico-diferencas-20261110
      - feat/mes-continuidade-com-quarentena-20261110
      - feat/mes-schedule-0720-ui-20261110
      - fix/mes-generalreport-auth-mode-20261109
      - fix/mes-postman-parity-20261109
    paths:
      - mes_general_report.py
      - mes_source_sync.py
      - tests/test_mes_source_sync.py
      - mes_general_report_validation.py
      - mes_general_report_reconciliation.py
      - tests/test_mes_general_report_reconciliation.py
      - streamlit_app.py
      - .github/workflows/mes-daily-0720.yml
      - tests/test_mes_general_report_validation.py
      - monitor_logic.py
      - data_store.py
      - tests/test_mes_general_report.py
      - .github/workflows/mes-general-report.yml
  pull_request:
    branches: [main]
jobs:
  mes-general-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências de validação
        run: python -m pip install "requests>=2.32,<3" "pandas>=2.2,<3" "openpyxl>=3.1,<4" "supabase>=2.28,<3"
      - name: Validar sintaxe
        run: python -m py_compile data_store.py monitor_logic.py mes_general_report.py mes_general_report_validation.py mes_general_report_reconciliation.py mes_source_sync.py streamlit_app.py .github/scripts/sync_mes_daily.py
      - name: Testar integração sem credenciais reais
        run: python -m unittest discover -s tests -p 'test_mes_*.py' -v
